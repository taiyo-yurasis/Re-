<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>野球盤 STADIUM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
 <div class="hd"><table id="sb"></table><div id="cn"></div></div>
 <div id="st"></div>
 <div id="prac-ctl"><button class="bt sm" id="prac-reset">成績リセット</button><button class="bt sm" id="prac-exit">タイトルへ</button></div>
 <div class="fw"><canvas id="f" width="480" height="400"></canvas><div id="bn"></div></div>
 <div id="msg"></div>
 <div class="ct">
  <canvas id="z" width="220" height="220"></canvas>
  <div class="bs">
   <div id="hint"><b>🏏 打撃</b>画面をドラッグでカーソル移動。ボールに重ねて<b>離した瞬間</b>にスイング!<br>(PC: クリックを離す / Space)</div>
   <button id="sw" class="bt">投げる!<small>クリック / Space</small></button>
   <div id="pts">
    <div class="pt-row">
     <button class="bt sm on" id="tg1">第一球種</button>
     <button class="bt sm" id="tg2">第二球種</button>
    </div>
    <div class="pt-row" id="p_group1">
     <button class="bt pt sm" data-t="s">ストレート</button>
     <button class="bt pt sm" data-t="sl">スライダー</button>
     <button class="bt pt sm" data-t="c">カーブ</button>
    </div>
    <div class="pt-row" id="p_group2" style="display:none">
     <button class="bt pt sm" data-t="f">フォーク</button>
     <button class="bt pt sm" data-t="sh">ツーシーム</button>
     <button class="bt pt sm" data-t="cu">チェンジアップ</button>
    </div>
   </div>
  </div>
 </div>
</div>
<div id="ov"><div class="card">
 <h2 id="ovt">⚾ 野球盤 STADIUM</h2>
 <p id="ovs">打撃: 画面をドラッグしてカーソルを合わせ、<b>指を離した瞬間</b>にスイング!<br>投球: 球種を選び、カーソルで狙って「投げる!」。</p>
 <div class="row"><button class="bt on" data-m="0">CPU戦</button><button class="bt" data-m="1">対人戦</button><button class="bt" data-m="2">オンライン</button><button class="bt" data-m="3">打撃練習</button></div>
 
 <div class="setting-box">
  <div class="setting-row">
   <span>投手:</span>
   <button class="bt sm on" data-ph="1">右</button>
   <button class="bt sm" data-ph="-1">左</button>
  </div>
  <div class="setting-row">
   <span>打者:</span>
   <button class="bt sm on" data-bs="right">右のみ</button>
   <button class="bt sm" data-bs="left">左のみ</button>
   <button class="bt sm" data-bs="random">左右ランダム</button>
  </div>
  <div class="setting-row" id="cpu-order-row">
   <span>CPU戦:</span>
   <button class="bt sm on" data-cpu-first="1">先攻</button>
   <button class="bt sm" data-cpu-first="0">後攻</button>
  </div>
 </div>

 <div id="prac-box" class="setting-box" style="display:none">
  <div class="setting-row" style="flex-wrap:wrap"><span>球種:</span>
   <button class="bt sm on" data-pt="s">ストレート</button><button class="bt sm on" data-pt="sl">スライダー</button><button class="bt sm on" data-pt="c">カーブ</button>
   <button class="bt sm on" data-pt="f">フォーク</button><button class="bt sm on" data-pt="sh">ツーシーム</button><button class="bt sm on" data-pt="cu">チェンジアップ</button></div>
  <div class="setting-row" style="flex-wrap:wrap"><span>コース:</span>
   <button class="bt sm on" data-pc="r">ランダム</button><button class="bt sm" data-pc="in">内角</button><button class="bt sm" data-pc="mid">真ん中</button><button class="bt sm" data-pc="out">外角</button></div>
  <div class="row"><button class="bt on" id="prac-go">練習スタート</button></div>
 </div>
 <div class="row" id="n-row"><button class="bt" data-n="3">3回戦で遊ぶ</button><button class="bt" data-n="5">5回戦で遊ぶ</button></div>
 <div class="row" id="room-row"><input id="code" placeholder="合言葉(英数6桁)"><button class="bt" id="jn">部屋に入る</button><button class="bt" id="cancel-room" style="display:none">キャンセル</button></div>
 <div class="version">Ver.1.0.1</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="hud.js"></script>
<script src="render.js"></script>
<script src="pitching.js"></script>
<script src="batting.js"></script>
<script src="plays.js"></script>
<script src="game.js"></script>
<script src="practice.js"></script>
<script src="net.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
