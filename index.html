<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>野球盤 STADIUM</title>
<style>
:root,:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1020;--panel:#16213e;--line:#2a3a66;--ink:#eef3ff;--mut:#8fa3c9;--acc:#ffd23f;--red:#ff5a5f;--blue:#4da3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{width:100%;max-width:480px;padding:8px}
.hd{display:flex;gap:8px;align-items:stretch}
table{border-collapse:collapse;font-size:12px;flex:1;background:var(--panel)}
th,td{padding:3px 5px;text-align:center;border:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
td:first-child{text-align:left;font-weight:700;white-space:nowrap}
#cn{background:var(--panel);border:1px solid var(--line);padding:4px 8px;font-size:12px;font-weight:700;display:flex;flex-direction:column;justify-content:space-around}
.l{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);margin-left:4px}
.l.on.lb{background:#4cd964}.l.on.ls{background:var(--acc)}.l.on.lo{background:var(--red)}
#st{margin:6px 2px;font-size:14px;font-weight:700;color:var(--acc)}
.fw{position:relative}
canvas{display:block;width:100%;height:auto;border-radius:12px}
#f{touch-action:none}
#bn{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:30px;color:#fff;text-shadow:0 2px 0 #000,0 0 18px var(--acc);pointer-events:none;opacity:0}
#bn.on{animation:pop 1.1s ease-out forwards}
#bn.hr{font-size:40px;color:var(--acc)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#msg{min-height:22px;margin:6px 2px;font-size:13px;color:var(--mut)}
.ct{display:flex;gap:10px;align-items:stretch}
#z{width:min(220px,52vw);flex:none;touch-action:none;border:2px solid var(--line)}
.bs{flex:1;display:flex;flex-direction:column;gap:6px}
.bt{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-weight:700;font-family:inherit}
.bt.on{border-color:var(--acc);color:var(--acc)}
.bt.sm{padding:5px 6px;font-size:12px;flex:1}
#sw{flex:1;min-height:70px;font-size:24px;background:linear-gradient(#ff7a59,#ff3d3d);border:0;color:#fff;box-shadow:0 4px 0 #a01f1f}
#sw small{display:block;font-size:11px;font-weight:500;opacity:.85}
#sw:active{transform:translateY(3px);box-shadow:0 1px 0 #a01f1f}
#pts{display:none;flex-direction:column;gap:4px;flex:1}
.pt-row{display:flex;gap:4px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.9);padding:20px;z-index:5;overflow-y:auto}
.card{max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px;margin:auto}
.card h2{margin:0;font-size:26px}
.row{display:flex;gap:8px}.row .bt{flex:1}
.setting-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left;font-size:13px;display:flex;flex-direction:column;gap:6px}
.setting-row{display:flex;align-items:center;gap:6px}
.setting-row span{width:70px;font-weight:700;color:var(--mut)}
.setting-row input[type="range"]{flex:1}
.setting-row small{width:36px;text-align:right;font-weight:700;color:var(--acc)}
#code{flex:1;min-width:0;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px}
#hint{display:none;flex:1;flex-direction:column;justify-content:center;gap:6px;font-size:13px;line-height:1.6;color:var(--mut)}
#hint b{color:var(--ink)}
.card p{margin:0;font-size:13px;line-height:1.6;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
 <div class="hd"><table id="sb"></table><div id="cn"></div></div>
 <div id="st"></div>

  <div class="bs">

   <button id="sw" class="bt">投げる!<small>クリック / Space</small></button>
   <div id="pts">

     <button class="bt sm on" id="tg1">第一球種</button>
     <button class="bt sm" id="tg2">第二球種</button>
    </div>
    <div class="pt-row" id="p_group1">

     <button class="bt pt sm" data-t="cu">チェンジアップ</button>

   </div>
  </div>
 </div>
</div>
<div id="ov"><div class="card">
 <h2 id="ovt">⚾ 野球盤 STADIUM</h2>
 <p id="ovs">打撃: 画面をドラッグしてカーソルを合わせ、<b>指を離した瞬間</b>にスイング!<br>投球: 球種を選び、カーソルで狙って「投げる!」。</p>
 <div class="row"><button class="bt on" data-m="0">CPU戦</button><button class="bt" data-m="1">対人戦</button><button class="bt" data-m="2">オンライン</button></div>
 
 <div class="setting-box">

 </div>

 <div class="setting-box" id="debug-settings-box">

 </div>

 <div class="row"><button class="bt" data-n="3">3回戦で遊ぶ</button><button class="bt" data-n="5">5回戦で遊ぶ</button></div>
 <div class="row"><input id="code" placeholder="合言葉(英数6桁)"><button class="bt" id="jn">部屋に入る</button></div>
</div></div>

<script>
const SUPA_URL='https://mbgdtwyhtiymmdoxuxwb.supabase.co',SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1iZ2R0d3lodGl5bW1kb3h1eHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMjQyODAsImV4cCI6MjEwNzcwMDI4MH0.W0rPvhxlRIvM4GzUzdU9gU2IPD6A9Wz_teWX4TMkRZY';
const $=i=>document.getElementById(i),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('f'),cx=cv.getContext('2d'),zc=$('z'),zx=zc.getContext('2d');
const HP={x:240,y:375},R=320,P=Math.PI,TC=['#ff5a5f','#4da3ff'];
const BS=[0,{x:311,y:304},{x:240,y:234},{x:169,y:304}];
const FD=[[240,292],[240,392],[322,300],[285,245],[195,245],[158,300],[120,170],[240,125],[360,170]];

const TY={
 s:{d:1050,j:8},
 sl:{d:1150,j:10},
 c:{d:1500,j:12},
 f:{d:1250,j:16},

/* ---- 設定管理 & LocalStorage ---- */
const DEFAULT_CONFIG = {
 cursorSize: 16,
 finePlayFly: 0.22,
 finePlayHit: 0.15
};
let CONFIG = { ...DEFAULT_CONFIG };

function loadConfig() {
 const saved = localStorage.getItem('stadium_debug_config');
 if (saved) {
  try { CONFIG = { ...DEFAULT_CONFIG, ...JSON.parse(saved) }; } catch (e) { CONFIG = { ...DEFAULT_CONFIG }; }
 }
 syncConfigUI();
}
function saveConfig() {
 localStorage.setItem('stadium_debug_config', JSON.stringify(CONFIG));
}
function syncConfigUI() {
 $('rng-cursor').value = CONFIG.cursorSize;
 $('val-cursor').textContent = CONFIG.cursorSize;
 $('rng-fp-fly').value = CONFIG.finePlayFly;
 $('val-fp-fly').textContent = Math.round(CONFIG.finePlayFly * 100) + '%';
 $('rng-fp-hit').value = CONFIG.finePlayHit;
 $('val-fp-hit').textContent = Math.round(CONFIG.finePlayHit * 100) + '%';
}
loadConfig();

$('rng-cursor').addEventListener('input', e => { CONFIG.cursorSize = +e.target.value; $('val-cursor').textContent = CONFIG.cursorSize; saveConfig(); });
$('rng-fp-fly').addEventListener('input', e => { CONFIG.finePlayFly = +e.target.value; $('val-fp-fly').textContent = Math.round(CONFIG.finePlayFly * 100) + '%'; saveConfig(); });
$('rng-fp-hit').addEventListener('input', e => { CONFIG.finePlayHit = +e.target.value; $('val-fp-hit').textContent = Math.round(CONFIG.finePlayHit * 100) + '%'; saveConfig(); });

let G={id:0};
const later=(ms,fn)=>{const id=G.id;setTimeout(()=>{if(G.id===id)fn()},ms)};
const tot=t=>G.runs[t].reduce((a,b)=>a+b,0);
const batHuman=()=>G.pvp||G.top,pitHuman=()=>G.pvp||!G.top;
const dist=p=>{const m=Math.max(Math.abs(p.x-110),Math.abs(p.y-110))/66;return m<=.4?0:m<=1?1:m<=1.5?2:3};

/* ---- stadium background (drawn once) ---- */
const bg=document.createElement('canvas');bg.width=480;bg.height=400;
(()=>{const g=bg.getContext('2d');
 g.fillStyle='#0a1020';g.fillRect(0,0,480,400);
 for(let i=0;i<1100;i++){const x=Math.random()*480,y=Math.random()*400;if(Math.hypot(x-240,y-375)>R+10){g.fillStyle=`hsl(${ri(0,360)},55%,${ri(30,60)}%)`;g.fillRect(x,y,3,3)}}
 g.fillStyle='#17653d';g.beginPath();g.arc(240,375,R+6,0,2*P);g.fill();
 const wd=r=>{g.beginPath();g.moveTo(240,375);g.arc(240,375,r,-.75*P,-.25*P);g.closePath()};
 wd(R+6);g.fillStyle='#8a5a3a';g.fill();
 for(let r=R-16,i=0;r>0;r-=24,i++){wd(r);g.fillStyle=i%2?'#2e9a4c':'#38b25a';g.fill()}
 g.save();wd(R-16);g.clip();g.fillStyle='#c88b52';g.beginPath();g.arc(240,300,108,0,2*P);g.fill();g.restore();
 g.fillStyle='#38b25a';g.beginPath();[[240,354],[290,304],[240,256],[190,304]].forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.fill();
 g.fillStyle='#c88b52';g.beginPath();g.arc(240,372,26,0,2*P);g.fill();
 g.fillStyle='#d9a066';g.beginPath();g.arc(240,292,13,0,2*P);g.fill();
 g.strokeStyle='#fff';g.lineWidth=2;[-1,1].forEach(s=>{g.beginPath();g.moveTo(240,375);g.lineTo(240+s*(R+6)*.7071,375-(R+6)*.7071);g.stroke()});
 g.strokeStyle='#ffd23f';g.lineWidth=4;g.beginPath();g.arc(240,375,R+6,-.75*P,-.25*P);g.stroke();
 g.fillStyle='#fff';BS.slice(1).forEach(b=>g.fillRect(b.x-6,b.y-6,12,12));g.fillRect(235,370,10,8);
 [[30,26],[450,26]].forEach(([x,y])=>{const r=g.createRadialGradient(x,y,0,x,y,70);r.addColorStop(0,'rgba(255,245,200,.9)');r.addColorStop(1,'rgba(255,245,200,0)');g.fillStyle=r;g.fillRect(x-70,y-70,140,140)});
})();

/* ---- drawing ---- */
function dot(x,y,r,f,s){cx.beginPath();cx.arc(x,y,r,0,7);cx.fillStyle=f;cx.fill();if(s){cx.strokeStyle=s;cx.lineWidth=2;cx.stroke()}}
const FSPD=.07;
function fpos(i,now){const b=FD[i],f=G.fl;
 if(G.rl){const m=G.rl.moves.find(q=>q.i===i);if(m){const e=Math.min(1,Math.max(0,(now-G.rl.t0)/m.T)),k=1-(1-e)*(1-e);return[b[0]+(m.x-b[0])*k,b[1]+(m.y-b[1])*k]}}
 if(!f)return b;
 if(f.fi===undefined){
  let m=1e9;
  let candidateIndices = [];
  if(f.kind === 'ground') {
   candidateIndices = [2,3,4,5];
   const distToMound = Math.hypot(f.to.x - 240, f.to.y - 310);
   if(distToMound < 50) candidateIndices.push(0);
  } else {
   candidateIndices = [6,7,8,2,3,4,5];
  }
  candidateIndices.forEach(j=>{
   const q=FD[j];
   const d=Math.hypot(q[0]-f.to.x,q[1]-f.to.y);
   if(d<m){m=d;f.fi=j}
  });
 }
 if(i===f.ri){const q=Math.hypot(f.to.x-b[0],f.to.y-b[1])||1,e=Math.min(1,(now-f.t0)/450);return[b[0]+(f.to.x-b[0])/q*16*e,b[1]+(f.to.y-b[1])/q*16*e]}
 if(i!==f.fi)return b;
 
 let targetTo = {x: f.to.x, y: f.to.y};
 if (f.isHit && i >= 6) {
  const dx = f.to.x - HP.x;
  const dy = f.to.y - HP.y;
  const dist = Math.hypot(dx, dy);
  const minDistance = 190;
  if (dist < minDistance) {
   targetTo.x = HP.x + (dx / dist) * minDistance;
   targetTo.y = HP.y + (dy / dist) * minDistance;
  }
 }

 const dx=targetTo.x-HP.x,dy=targetTo.y-HP.y,k=Math.min(1,(R-14)/Math.hypot(dx,dy)),tx=HP.x+dx*k,ty=HP.y+dy*k,d=Math.hypot(tx-b[0],ty-b[1]);
 let T=d/FSPD;if(f.out)T=Math.min(T,f.dur*.92);
 const p=T>0?Math.min(1,(now-f.t0)/T):1,e=1-(1-p)*(1-p);
 const dive=(f.diving&&p>.6)?Math.sin((p-.6)*2.5*P)*10:0;
 return[b[0]+(tx-b[0])*e+dive,b[1]+(ty-b[1])*e-dive]}

function drawField(now){
 cx.drawImage(bg,0,0);
 const bt=G.top?0:1;
 FD.forEach((_,i)=>{const[x,y]=fpos(i,now);dot(x,y,6,TC[1-bt],'#fff')});
 const mv=G.mv&&now-G.mv.t0<G.mv.dur?G.mv:null,bm=!!mv&&mv.moves.some(m=>m.a===0);
 const rd=(x,y)=>{cx.save();cx.shadowColor=TC[bt];cx.shadowBlur=14;dot(x,y,8,TC[bt],'#fff');cx.restore()};
 if(mv){mv.stay.forEach(b=>rd(BS[b].x,BS[b].y));mv.moves.forEach(m=>{const el=now-mv.t0;if(m.o&&el>=m.o)return;const q=rpos(m.a,m.b,Math.min(1,el/(m.T||550*(m.b-m.a))));rd(q[0],q[1])})}
 else for(let b=1;b<4;b++)if(G.bases&&G.bases[b])rd(BS[b].x,BS[b].y);
 
 const batterSide = G.batterSides ? G.batterSides[G.top ? 0 : 1] : 'right';
 const isRightBatter = (batterSide === 'right');
 const bx = isRightBatter ? 219 : 261;
 const by = 370;
 const sk = (now-G.swingT)/230;
 const a = sk>=0&&sk<1.6 ? -2.2+2.8*Math.min(sk,1) : -1.1;
 const batAngle = isRightBatter ? a : Math.PI - a;

 if(!bm) dot(bx, by, 7, TC[bt], '#fff');
 if(!bm) {
  cx.strokeStyle='#e0b878';
  cx.lineWidth=4;
  cx.beginPath();
  cx.moveTo(bx, by);
  cx.lineTo(bx + 26 * Math.cos(batAngle), by + 26 * Math.sin(batAngle));
  cx.stroke();
 }

 if(G.phase==='pitch'&&G.pitch)dot(240,292+80*cl(G.pitch.t||0,0,1),3.5,'#fff');
 if(G.fl&&!G.th){const f=G.fl,p=cl((now-f.t0)/f.dur,0,1),bk=f.wall?cl((now-f.t0-f.dur)/300,0,1)*16:0,ux=f.to.x-HP.x,uy=f.to.y-HP.y,ul=Math.hypot(ux,uy)||1,x=HP.x+ux*p-ux/ul*bk,y=HP.y+uy*p-uy/ul*bk;
  const h=f.kind==='ground'?Math.abs(Math.sin(p*P*5))*8*(1-p):f.h*4*p*(1-p);
  cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.ellipse(x,y,5,2.5,0,0,7);cx.fill();
  dot(x,y-h,4+h/25,'#fff','#c33')}
 
 if(G.th)drawTh(now);
}

function drawTh(now){const t=G.th;
 if(t.steps){let el=now-t.t0,st=0,pos=null;
  for(const q of t.steps){const a=st+(q.dly||0),b=a+q.dur;
   if(el<a){pos=[q.from.x,q.from.y];break}
   if(el<b){const p=(el-a)/q.dur;pos=[q.from.x+(q.to.x-q.from.x)*p,q.from.y+(q.to.y-q.from.y)*p-Math.sin(p*P)*14];break}
   st=b;pos=[q.to.x,q.to.y]}
  if(pos)dot(pos[0],pos[1],4,'#fff','#c33')}
 else{const p=(now-t.t0)/t.dur;if(p>=0&&p<1){const x=t.from.x+(t.to.x-t.from.x)*p,y=t.from.y+(t.to.y-t.from.y)*p-Math.sin(p*P)*14;dot(x,y,4,'#fff','#c33')}}}

function throwPlan(to, targetBase){
 const tp = targetBase === 4 ? {x: HP.x, y: HP.y} : {x: BS[targetBase].x, y: BS[targetBase].y};
 const L = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), dd = L(to, tp), relay = dd >= 130 && Math.random() < cl((dd - 130) / 140, .25, .85);
 const cov = targetBase === 2 ? 4 : targetBase === 3 ? 5 : 1, rm = targetBase === 4 ? 2 : 3, mv = [], sp = .55;
 let R = null;
 if(relay){R = {x: tp.x + (to.x - tp.x) * .4, y: tp.y + (to.y - tp.y) * .4}; mv.push({i: rm, x: R.x, y: R.y, T: Math.max(500, Math.hypot(FD[rm][0] - R.x, FD[rm][1] - R.y) / .1)})}
 if(cov !== 1) mv.push({i: cov, x: tp.x, y: tp.y, T: Math.max(500, Math.hypot(FD[cov][0] - tp.x, FD[cov][1] - tp.y) / .1)});
 const steps = R ? [{from: to, to: R, dur: Math.max(220, L(to, R) / sp)}, {from: R, to: tp, dur: Math.max(200, L(R, tp) / sp), dly: 150}] : [{from: to, to: tp, dur: Math.max(250, L(to, tp) / sp)}];
 return {steps, mv};
}

function bp(p,t){const e=Math.min(t,1.2),u=Math.min(e,1),S={x:110,y:40};
 let x=S.x+(p.x-S.x)*e,y=S.y+(p.y-S.y)*(e<=1?Math.pow(e,2.2):1+(e-1)*2.2);
 if(p.type==='c'){
  x+=p.sg*24*Math.sin(P*Math.pow(u,.7));
 }else if(p.type==='sl'){
  x+=p.sg*16*Math.sin(P*Math.pow(u,.9));
 }else if(p.type==='sh'){
  x-=p.sg*16*Math.sin(P*Math.pow(u,.9));
 }else if(p.type==='f'){
  y=S.y+(p.y-S.y)*(e<=1?Math.pow(e,2.2):1+(e-1)*2.2);
 }
 return[x,y]}

function drawZone(){const u=44,c=zx;
 c.fillStyle='#0f1a33';c.fillRect(0,0,220,220);

/* ---- game flow ---- */
let cfgPitcher = 1;
let cfgBatter = 'right';

function newGame(N,pvp,isOnline){
 const pHand = cfgPitcher;
 const bSide1 = cfgBatter === 'random' ? (Math.random() < 0.5 ? 'right' : 'left') : cfgBatter;
 const bSide2 = cfgBatter === 'random' ? (Math.random() < 0.5 ? 'right' : 'left') : cfgBatter;

 if (isOnline) {
  CONFIG = { ...DEFAULT_CONFIG };
 } else {
  loadConfig();
 }

 G={
  id:G.id+1,
  N,
  pvp:!!pvp,
  inn:1,
  top:true,
  outs:0,
  cnt:{b:0,s:0},
  bases:[0,0,0,0],
  runs:[[],[]],
  hits:[0,0],
  phase:'idle',
  pitch:null,
  sel:'s',
  fl:null,
  over:false,
  last:null,
  swingT:-1e9,
  walkoff:false,
  cur:{x:110,y:110},

}

function startHalf(){G.outs=0;G.bases=[0,0,0,0];G.cnt={b:0,s:0};G.runs[G.top?0:1][G.inn-1]=0;G.fl=null;G.th=null;G.mv=null;G.rl=null;G.pitch=null;G.phase='idle';
 banner(`${G.inn}回${G.top?'表':'裏'}`);updateHud();later(1300,ready)}
function ready(){if(G.over)return;G.fl=null;G.th=null;G.mv=null;G.rl=null;G.pitch=null;G.phase='ready';G.cur={x:110,y:110};updateHud();
 if(!pitHuman()){setMsg('カーソルをボールに合わせて、離した瞬間にスイング!');
  later(rnd(700,1300),()=>{
   const keys=Object.keys(TY);const t=keys[ri(0,keys.length-1)];let x,y;
   if(Math.random()<.62){x=rnd(52,168);y=rnd(52,168)}else{x=rnd(20,200);y=rnd(20,200)}
   throwP(t,x,y)})}
 else{G.phase='aim';setMsg(G.pvp?(G.top?'P2':'P1')+'投手: 球種を選んで狙って「投げる!」 / '+(G.top?'P1':'P2')+'は構えて!':'球種を選んで、カーソルで狙って、投げる!')}}

function throwP(t,x,y){
 const defTeam = G.top ? 1 : 0;
 const sgDir = G.pitcherHands ? G.pitcherHands[defTeam] : 1;

 G.pitch={
  id:++pid,
  type:t,
  x,
  y,
  t0:performance.now(),
  dur:TY[t].d*(pitHuman()?1:rnd(.9,1.1)),
  sg: sgDir,
  t:0
 };
 G.phase='pitch';
 if(G.pvp&&!G.net){G.cur={x:110,y:110};lastT=null;mdown=false}
 setMsg(G.pvp?'打者!カーソルをボールに合わせて、離した瞬間にスイング!':'投げた!');
 sync();
}

function update(now){if(G.phase!=='pitch')return;const p=G.pitch;if(!p)return;p.t=(now-p.t0)/p.dur;
 if(G.net==='guest')return;if(batHuman()){if(p.t>(G.net?1.2+500/p.dur:1.2)){G.phase='busy';take()}}
 else if(p.t>=.98){G.phase='busy';cpuBat()}}
function take(){result(dist(G.pitch)<=1?'look':'ball')}

function goodQ(side,isLeft,isFast){const g=(isLeft&&isFast)||(!isLeft&&!isFast);return side==='right'?g:!g}
function swing(){
 if(G.phase!=='pitch'||!canBat())return;
 if(G.net==='guest'){
  const p=G.pitch;if(!p||p.swung)return;p.swung=1;G.swingT=performance.now();
  send('swing',{t:(performance.now()-p.t0)/p.dur,x:G.cur.x,y:G.cur.y});
  return;
 }
 const now=performance.now(),p=G.pitch;
 p.t=(now-p.t0)/p.dur;G.phase='busy';G.swingT=now;
 const ms=now-p.t0-p.dur,[bx,by]=bp(p,p.t);
 const dd=Math.hypot(bx-G.cur.x, by-G.cur.y);
 const d=dist(p);

 if(Math.abs(ms)>220 || dd>CONFIG.cursorSize || (d>=2 && Math.random()<.6)){
  return result('miss', ms);
 }

 const isUpper = by < G.cur.y;
 const batterSide = G.batterSides ? G.batterSides[G.top ? 0 : 1] : 'right';
 const isLeft = bx < G.cur.x;
 const isFast = ms < 0;

 const isGoodQuality = goodQ(batterSide, isLeft, isFast);

 let k = 'fly';
 if (!isGoodQuality) {
  if (isUpper) {
   k = Math.random() < 0.6 ? 'fly' : '1B';
  } else {
   k = Math.random() < 0.7 ? 'gr' : '1B';
  }
 } else {
  if (isUpper) {
   const r = Math.random();
   if (r < 0.3) k = 'HR';
   else if (r < 0.55) k = '2B';
   else if (r < 0.8) k = 'fly';
   else k = '3B';
  } else {
   const r = Math.random();
   if (r < 0.45) k = '1B';
   else if (r < 0.7) k = '2B';
   else if (r < 0.9) k = 'gr';
   else k = '3B';
  }
 }

 result(k, ms);
}

function cpuBat(){const p=G.pitch,d=dist(p),z=d<=1,rep=p.type===G.last;G.last=p.type;
 let sw=z?(d?.7:.8):(p.type==='f'||p.type==='sh'?.4:.2);if(G.cnt.s==2)sw+=.15;
 if(Math.random()>sw)return take();
 G.swingT=performance.now();
 const c=.72-(p.type==='c'||p.type==='cu'?.1:p.type==='f'?.14:0)-(d==1?.08:0)-(d>=2?.35:0)+(rep?.12:0);
 if(Math.random()>c)return result('miss', 0);
 
 const r = Math.random();
 let k = r < 0.25 ? 'HR' : r < 0.5 ? '2B' : r < 0.75 ? '1B' : r < 0.9 ? 'gr' : 'fly';
 result(k, 0);
}

function flight(to,kind,cb,out,o){const d=Math.hypot(to.x-HP.x,to.y-HP.y),dur=kind==='ground'?300+d*3.2:500+d*2.6;
 G.fl={id:++pid,out:!!out,t0:performance.now(),dur,to,kind,h:kind==='hr'?130:30+d*.35,...(o||{})};sync();later(dur+250,cb)}
function next(ms){updateHud();later(ms,ready)}
function fin(ms){if(G.th&&G.th.steps)ms=Math.max(ms,G.th.steps.reduce((a,q)=>a+(q.dly||0)+q.dur,0)-(performance.now()-G.th.t0)+400);if(G.mv)ms=Math.max(ms,G.mv.dur-(performance.now()-G.mv.t0)+350);G.cnt={b:0,s:0};updateHud();
 if(G.walkoff)return later(Math.max(1500,ms),over);
 if(G.outs>=3)return later(ms+300,endHalf);
 later(ms,ready)}
function score(r){if(!r)return;G.runs[G.top?0:1][G.inn-1]+=r;
 if(!G.top&&G.inn>=G.N&&tot(1)>tot(0))G.walkoff=true;updateHud()}
function rpos(a,b,p){const Q=[HP,BS[1],BS[2],BS[3],HP],L=[];let T=0;for(let i=a;i<b;i++){const l=Math.hypot(Q[i+1].x-Q[i].x,Q[i+1].y-Q[i].y);L.push(l);T+=l}
 let d=T*p;for(let i=a;i<b;i++){const l=L[i-a];if(d<=l||i===b-1){const t=l?Math.min(1,d/l):1;return[Q[i].x+(Q[i+1].x-Q[i].x)*t,Q[i].y+(Q[i+1].y-Q[i].y)*t]}d-=l}}
function mvAdd(m){const t=performance.now();if(!G.mv||t-G.mv.t0>G.mv.dur)G.mv={id:++pid,t0:t,dur:0,moves:[],stay:[1,2,3].filter(b=>G.bases[b])};G.mv.moves.push(m);G.mv.dur=Math.max(G.mv.dur,m.T||(m.b-m.a)*580)}

function adv(n,bat){let r=0;const nb=[0,0,0,0],mvs=[],stay=[];
 for(let b=3;b>=1;b--){if(!G.bases[b])continue;let t=b+n;if(t>=4){r++;mvs.push({a:b,b:4});continue}while(t>b&&nb[t])t--;nb[t]=1;t>b?mvs.push({a:b,b:t}):stay.push(b)}
 if(bat){if(n>=4){r++;mvs.push({a:0,b:4})}else{let p=n;while(p>1&&nb[p])p--;nb[p]=1;mvs.push({a:0,b:p})}}
 G.bases=nb;G.mv=mvs.length?{id:++pid,t0:performance.now(),dur:Math.max(...mvs.map(m=>(m.b-m.a)*580)),moves:mvs,stay}:null;return r}

function walk(){const B=G.bases,old=[1,2,3].filter(b=>B[b]),mvs=[{a:0,b:1}];let r=0;
 const nb=[0,0,0,0];
 if(B[1]){
  if(B[2]){
   if(B[3]){r++;mvs.push({a:3,b:4});}
   else{mvs.push({a:2,b:3});nb[3]=1;}
   nb[2]=1;
  }else{mvs.push({a:1,b:2});nb[2]=1;}
  nb[3]=nb[3]||B[3];
 }
 nb[1]=1;
 const finalNb=[0, nb[1], nb[2], nb[3]];
 G.bases=finalNb;
 G.mv={id:++pid,t0:performance.now(),dur:580,moves:mvs,stay:old.filter(b=>!mvs.some(m=>m.a===b))};score(r)}

function showDetailMsg(k, ms) {
 const p = G.pitch;
 const typeName = p && TY_NAMES[p.type] ? TY_NAMES[p.type] : '球種不明';
 
 let timingText = '';
 if (ms != null) {
  const absMs = Math.abs(ms);
  let tEval = 'タイミング：完璧';
  if (absMs >= 140) tEval = ms < 0 ? 'タイミング：早すぎ' : 'タイミング：遅すぎ';
  else if (absMs >= 70) tEval = ms < 0 ? 'タイミング：少し早い' : 'タイミング：少し遅い';
  timingText = `[ ${typeName} / ${tEval} ] `;
 } else {
  timingText = `[ ${typeName} ] `;
 }

 let actionText = '';
 switch(k){
  case 'ball': actionText = 'ボール'; break;
  case 'look': actionText = '見逃しストライク'; break;
  case 'miss': actionText = '空振り！'; break;
  case 'foul': actionText = 'ファウル'; break;
  case 'gr': actionText = 'ゴロアウト'; break;
  case 'fly': actionText = 'フライアウト'; break;
  case '1B': actionText = 'ヒット！'; break;
  case '2B': actionText = 'ツーベース！'; break;
  case '3B': actionText = 'スリーベース！'; break;
  case 'HR': actionText = 'ホームラン！！'; break;
  default: actionText = k;
 }

 setMsg(timingText + actionText);
}

function result(k,ms){const c=G.cnt;
 if(k==='ball'){c.b++;if(c.b>=4){banner('フォアボール');walk();return fin(1100)}showDetailMsg('ball', null);return next(800)}
 if(k==='look'||k==='miss'){c.s++;const m=k==='miss';
  if(c.s>=3){banner(m?'空振り三振!':'見逃し三振!');G.outs++;showDetailMsg(k, ms);return fin(1200)}
  showDetailMsg(k, ms);return next(800)}
 if(k==='foul'){if(c.s<2)c.s++;const ad=rnd(46,78),a=(Math.random()<.5?-1:1)*ad*P/180,d=rnd(90,200),to={x:240+d*Math.sin(a),y:375-d*Math.cos(a)},cp=ad<66?(66-ad)/20*.6:0;
  if(Math.random()<cp){banner('ファウルフライ!');flight(to,'fly',()=>{G.outs++;banner('ファウルフライアウト');showDetailMsg('foul', ms);fin(1000)},1);return}
  showDetailMsg('foul', ms);flight(to,'fly',()=>next(200));return}
 if(k==='gr'){const a=rnd(-35,35)*P/180,d=rnd(70,130);banner('ゴロ!');
  const dp=G.bases[1]&&G.outs<2&&Math.random()<.35,end=G.outs+1+(dp?1:0)>=3;let r=0;
  if(dp)G.bases[1]=0;if(!end)r=adv(1,false);
  flight({x:240+d*Math.sin(a),y:375-d*Math.cos(a)},'ground',()=>{
   G.outs++;let m='ゴロアウト';if(dp){G.outs++;m='ダブルプレー!'}
   score(r);
   if(G.fl) {
    if(dp) {
     G.th = {
      id: ++pid,
      t0: performance.now(),
      steps: [
       {from: G.fl.to, to: BS[2], dur: 250},
       {from: BS[2], to: BS[1], dur: 250}
      ],
      currentStep: 0
     };
    } else {
     G.th = {id:++pid, t0:performance.now(), dur:380, from:G.fl.to, to:BS[1]};
    }
   }
   banner(m);showDetailMsg('gr', ms);fin(800)},1);
  const o=G.fl.dur+250+380;mvAdd({a:0,b:1,T:o+100,o});if(dp)mvAdd({a:1,b:2,T:o+100,o});return}
 if(k==='fly'){const a=rnd(-38,38)*P/180,d=rnd(160,270);banner('フライ!');
  
  const isFinePlay = Math.random() < CONFIG.finePlayFly;
  
  flight({x:240+d*Math.sin(a),y:375-d*Math.cos(a)},'fly',()=>{
   G.outs++;
   let m = isFinePlay ? 'ファインプレー!!' : 'フライアウト';
   if(G.bases[3]&&G.outs<3&&d>=215&&Math.random()<.6&&!isFinePlay){G.bases[3]=0;mvAdd({a:3,b:4});score(1);m='犠牲フライ!'}
   banner(m, isFinePlay ? 'hr' : '');
   showDetailMsg('fly', ms);
   fin(1000);
  }, 1, isFinePlay ? {diving:true} : null);
  return;}
 hit(k,ms)}

function nrst(to,ids){let m=1e9,r=ids[0];ids.forEach(j=>{const q=Math.hypot(FD[j][0]-to.x,FD[j][1]-to.y);if(q<m){m=q;r=j}});return r}

function hit(k, ms) {
 const n = {'1B':1, '2B':2, '3B':3, HR:4}[k];
 const a = cl(ms!=null?cl(ms*.3,-38,38)+rnd(-9,9):rnd(-40,40),-42,42)*P/180;
 
 const edge = (k==='2B'||k==='3B')&&Math.abs(a)>=36*P/180;
 const wall = (k==='2B'||k==='3B')&&!edge;
 const ground = edge||(k==='1B'&&Math.random()<.5);
 
 const d = wall ? R-8 : (k==='1B' ? rnd(190,230) : k==='2B' ? rnd(235,290) : k==='3B' ? rnd(295,312) : rnd(345,380));
 const to = {x: 240 + d * Math.sin(a), y: 375 - d * Math.cos(a)};
 
 const isFinePlayHit = (k === '1B' || k === '2B') && Math.random() < CONFIG.finePlayHit;

 if (isFinePlayHit) {
  G.outs++;
  banner('ファインプレー！！', 'hr');
  showDetailMsg('miss', ms);
  flight(to, 'fly', () => {
   banner('ヒット性の当たりをもぎ取った！');
   fin(1200);
  }, 1, {diving: true});
  return;
 }

 const b1 = G.bases[1] ? 1 : 0;
 const b2 = G.bases[2] ? 1 : 0;
 const b3 = G.bases[3] ? 1 : 0;
 const pattern = (b1 << 2) | (b2 << 1) | b3;
 
 let r = 0;
 const nb = [0, 0, 0, 0];
 const mvs = [];
 const stay = [];
 let targetBaseForThrow = 2;
 
 if (k === 'HR') {
  if(b3){ r++; mvs.push({a:3, b:4}); }
  if(b2){ r++; mvs.push({a:2, b:4}); }
  if(b1){ r++; mvs.push({a:1, b:4}); }
  r++; mvs.push({a:0, b:4});
  G.bases = [0,0,0,0];
  targetBaseForThrow = 0;
 } else {
  switch(pattern) {
   case 0: // ランナーなし
    if (n === 1) {
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 1;
    } else if (n === 2) {
     // ツーベースなら確実に2塁で止まる
     mvs.push({a:0, b:2}); nb[2] = 1;
     targetBaseForThrow = 2;
    } else {
     mvs.push({a:0, b:3}); nb[3] = 1;
     targetBaseForThrow = 3;
    }
    break;

   case 1: // 3塁ランナーのみ
    r++; mvs.push({a:3, b:4});
    if (n === 1) {
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 1;
    } else if (n === 2) {
     // ツーベースなら確実に2塁で止まる
     mvs.push({a:0, b:2}); nb[2] = 1;
     targetBaseForThrow = 2;
    } else {
     mvs.push({a:0, b:3}); nb[3] = 1;
     targetBaseForThrow = 3;
    }
    break;

   case 2:
    r++; mvs.push({a:2, b:4});
    if (n === 1) {
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 4;
    } else {
     const to3rd = n === 3 || Math.random() < 0.5;
     mvs.push({a:0, b: to3rd ? 3 : 2}); nb[to3rd ? 3 : 2] = 1;
     targetBaseForThrow = 4;
    }
    break;

   case 3:
    r++; mvs.push({a:3, b:4});
    if (n === 1) {
     const r2Home = Math.random() < 0.65;
     if (r2Home) {
      r++; mvs.push({a:2, b:4});
     } else {
      mvs.push({a:2, b:3}); nb[3] = 1;
     }
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 4;
    } else {
     r++; mvs.push({a:2, b:4});
     const b3Target = n === 3 ? 3 : (Math.random() < 0.3 ? 3 : 2);
     mvs.push({a:0, b: b3Target}); nb[b3Target] = 1;
     targetBaseForThrow = 4;
    }
    break;

   case 4:
    if (n === 1) {
     const r1To3rd = Math.random() < 0.3;
     if (r1To3rd) {
      mvs.push({a:1, b:3}); nb[3] = 1;
      targetBaseForThrow = 3;
     } else {
      mvs.push({a:1, b:2}); nb[2] = 1;
      targetBaseForThrow = 2;
     }
     mvs.push({a:0, b:1}); nb[1] = 1;
    } else {
     r++; mvs.push({a:1, b:4});
     const batTarget = n === 3 ? 3 : (Math.random() < 0.3 ? 3 : 2);
     mvs.push({a:0, b: batTarget}); nb[batTarget] = 1;
     targetBaseForThrow = 4;
    }
    break;

   case 5:
    r++; mvs.push({a:3, b:4});
    if (n === 1) {
     const r1To3rd = Math.random() < 0.3;
     if (r1To3rd) {
      mvs.push({a:1, b:3}); nb[3] = 1;
      targetBaseForThrow = 3;
     } else {
      mvs.push({a:1, b:2}); nb[2] = 1;
      targetBaseForThrow = 2;
     }
     mvs.push({a:0, b:1}); nb[1] = 1;
    } else {
     r++; mvs.push({a:1, b:4});
     const batTarget = n === 3 ? 3 : (Math.random() < 0.3 ? 3 : 2);
     mvs.push({a:0, b: batTarget}); nb[batTarget] = 1;
     targetBaseForThrow = 4;
    }
    break;

   case 6:
    if (n === 1) {
     const r2Home = Math.random() < 0.5;
     if (r2Home) {
      r++; mvs.push({a:2, b:4});
      mvs.push({a:1, b:3}); nb[3] = 1;
     } else {
      mvs.push({a:2, b:3}); nb[3] = 1;
      mvs.push({a:1, b:2}); nb[2] = 1;
     }
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 4;
    } else {
     r++; mvs.push({a:2, b:4});
     const r1Home = Math.random() < 0.7;
     if (r1Home) {
      r++; mvs.push({a:1, b:4});
     } else {
      mvs.push({a:1, b:3}); nb[3] = 1;
     }
     const batTarget = n === 3 ? 3 : (Math.random() < 0.4 ? 3 : 2);
     mvs.push({a:0, b: batTarget}); nb[batTarget] = 1;
     targetBaseForThrow = 4;
    }
    break;

   case 7:
    r++; mvs.push({a:3, b:4});
    if (n === 1) {
     const r2Home = Math.random() < 0.6;
     if (r2Home) {
      r++; mvs.push({a:2, b:4});
      mvs.push({a:1, b:3}); nb[3] = 1;
     } else {
      mvs.push({a:2, b:3}); nb[3] = 1;
      mvs.push({a:1, b:2}); nb[2] = 1;
     }
     mvs.push({a:0, b:1}); nb[1] = 1;
     targetBaseForThrow = 4;
    } else {
     r++; mvs.push({a:3, b:4});
     r++; mvs.push({a:2, b:4});
     const r1Home = Math.random() < 0.75;
     if (r1Home) {
      r++; mvs.push({a:1, b:4});
     } else {
      mvs.push({a:1, b:3}); nb[3] = 1;
     }
     const batTarget = n === 3 ? 3 : 2;
     mvs.push({a:0, b: batTarget}); nb[batTarget] = 1;
     targetBaseForThrow = 4;
    }
    break;
  }
  G.bases = [0, nb[1], nb[2], nb[3]];
 }

 G.mv = mvs.length ? {id: ++pid, t0: performance.now(), dur: Math.max(...mvs.map(m => (m.b - m.a) * 580)), moves: mvs, stay} : null;

 const o = edge ? {fi: nrst(to, [6, 8]), ri: nrst(to, [2, 5])} : k === '1B' ? {fi: nrst(to, [6, 7, 8]), ...(ground ? {ri: nrst(to, [0, 2, 3, 4, 5])} : {h: 22})} : (k === '2B' || k === '3B') ? {fi: nrst(to, [6, 7, 8]), wall} : null;
 G.hits[G.top ? 0 : 1]++;
 banner({'1B':'ヒット!','2B':'ツーベース!','3B':'スリーベース!',HR:'ホームラン!!'}[k], k==='HR'?'hr':'');
 showDetailMsg(k, ms);
 
 let actualTo = {x: to.x, y: to.y};
 const fi = nrst(to, [6, 7, 8]);
 if (fi >= 6) {
  const dx = to.x - HP.x, dy = to.y - HP.y, dist = Math.hypot(dx, dy);
  if (dist < 190) {
   actualTo.x = HP.x + (dx / dist) * 190;
   actualTo.y = HP.y + (dy / dist) * 190;
  }
 }

 const pl = targetBaseForThrow === 0 ? null : throwPlan(actualTo, targetBaseForThrow);
 
 flight(to, k==='HR'?'hr':ground?'ground':'fly', () => {
  score(r);
  if(r) banner(`+${r}点!`, k==='HR'?'hr':'');
  if(pl) G.th = {id: ++pid, t0: performance.now(), steps: pl.steps};
  fin(1200);
 }, 0, {...o, isHit: true});

 if (pl && pl.mv.length) G.rl = {id: ++pid, t0: performance.now(), moves: pl.mv};
}

function endHalf(){
 const a=tot(0), b=tot(1);
 const isOverByInning = G.inn >= G.N && a !== b;
 const ed = G.top ? (G.inn >= G.N && b > a) : (isOverByInning || (G.inn >= G.N && a === b && !G.top));

 banner(ed?'ゲームセット':'チェンジ');
 later(ed?1800:1300,()=>{
  if(ed)return over();
  if(G.top)G.top=false;
  else{G.inn++;G.top=true;}
  startHalf();
 });
}

function over(){G.over=true;G.phase='over';const a=tot(0),b=tot(1);
 $('ovt').textContent=G.pvp?(a>b?'🎉 P1の勝ち!':a<b?'🎉 P2の勝ち!':'🤝 引き分け'):a>b?'🎉 勝利!':a<b?(G.walkoff?'😢 サヨナラ負け…':'😢 敗北…'):'🤝 引き分け';
 $('ovs').textContent=G.pvp?`P1 ${a} - ${b} P2`:`あなた ${a} - ${b} CPU`;$('ov').style.display='flex';$('debug-settings-box').style.display = pvpSel === 2 ? 'none' : 'block';
}

/* ---- input ---- */
const setCur=(x,y)=>{G.cur.x=cl(x,0,220);G.cur.y=cl(y,0,220)};
const zpt=e=>{const r=zc.getBoundingClientRect();return[(e.clientX-r.left)/r.width*220,(e.clientY-r.top)/r.height*220]};
const fpt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*220,(e.clientY-r.top)/r.height*220]};

function pitchNow(){if(G.phase!=='aim'||!canPit())return;const j=TY[G.sel].j,a=rnd(0,2*P),r=j*Math.sqrt(Math.random()),x=cl(G.cur.x+r*Math.cos(a),0,220),y=cl(G.cur.y+r*Math.sin(a),0,220);
 if(G.net==='guest'){G.phase='sent';G.sentAt=performance.now();send('throw',{type:G.sel,x,y});return}
 throwP(G.sel,x,y)}
function act(){if(G.phase==='aim'){if(pitHuman())pitchNow()}else swing()}
let lastT=null,mdown=false;

function bind(el){
 el.addEventListener('pointerdown',e=>{e.preventDefault();
  if(e.pointerType==='mouse'){
   if(el===zc) setCur(...zpt(e));
   else if(el===cv) setCur(...fpt(e));
   if(G.phase==='aim') pitchNow(); else mdown=true;
  } else {lastT=[e.clientX,e.clientY]}
 });
 el.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
   if(el===zc) setCur(...zpt(e));
   else if(el===cv) setCur(...fpt(e));
  } else if(lastT){
   const k=220/zc.getBoundingClientRect().width*1.6;
   setCur(G.cur.x+(e.clientX-lastT[0])*k, G.cur.y+(e.clientY-lastT[1])*k);
   lastT=[e.clientX,e.clientY];
  }
 });
}
bind(zc);bind(cv);
addEventListener('pointerup',e=>{const w=e.pointerType==='mouse'?mdown:lastT;mdown=false;lastT=null;if(w&&batHuman()&&G.phase==='pitch')swing()});
addEventListener('pointercancel',()=>{lastT=null;mdown=false});
$('sw').addEventListener('pointerdown',e=>{e.preventDefault();pitchNow()});

document.querySelectorAll('.pt').forEach(b=>b.addEventListener('click',()=>{G.sel=b.dataset.t;updateHud()}));
$('tg1').addEventListener('click',()=>{
 $('tg1').classList.add('on');$('tg2').classList.remove('on');
 $('p_group1').style.display='flex';$('p_group2').style.display='none';
});
$('tg2').addEventListener('click',()=>{
 $('tg2').classList.add('on');$('tg1').classList.remove('on');
 $('p_group2').style.display='flex';$('p_group1').style.display='none';
});

document.querySelectorAll('[data-ph]').forEach(b=>b.addEventListener('click',e=>{
 document.querySelectorAll('[data-ph]').forEach(x=>x.classList.remove('on'));
 e.target.classList.add('on');
 cfgPitcher = +e.target.dataset.ph;
}));
document.querySelectorAll('[data-bs]').forEach(b=>b.addEventListener('click',e=>{
 document.querySelectorAll('[data-bs]').forEach(x=>x.classList.remove('on'));
 e.target.classList.add('on');
 cfgBatter = e.target.dataset.bs;
}));

addEventListener('keydown',e=>{
 if(e.code==='Space'||e.key==='Enter'){e.preventDefault();act()}
});
document.querySelectorAll('#ov [data-n]').forEach(b=>b.addEventListener('click',()=>{
 $('ov').style.display='none';if(pvpSel===2)return hostRoom(+b.dataset.n);newGame(+b.dataset.n,pvpSel,false);startHalf()}));

let pvpSel=0,ck='';
document.querySelectorAll('#ov [data-m]').forEach(b=>b.addEventListener('click',()=>{
 pvpSel=+b.dataset.m;
 document.querySelectorAll('#ov [data-m]').forEach(x=>x.classList.toggle('on',x===b));
 $('debug-settings-box').style.display = pvpSel === 2 ? 'none' : 'block';
}));
function ctl(){const k=G.net?(G.phase==='aim'&&canPit()?'p':'h'):G.pvp?(G.phase==='aim'?'p':'h'):(G.top?'h':'p');if(k===ck)return;ck=k;
 $('pts').style.display=k==='p'?'flex':'none';$('sw').style.display=k==='p'?'':'none';$('hint').style.display=k==='h'?'flex':'none'}

/* ---- online (room) ---- */
let RM=null,pid=0,gb=0,hostN=3,SB=null;
function sbRoom(){if(!SB&&window.supabase&&!SUPA_URL.includes('YOUR-')&&!SUPA_KEY.includes('YOUR-'))SB=supabase.createClient(SUPA_URL,SUPA_KEY,{realtime:{params:{eventsPerSecond:15}}});return SB?{join:joinRoom}:null}
function joinRoom(name){return new Promise((res,rej)=>{const ch=SB.channel(name,{config:{broadcast:{self:false}}}),hs={};
 ['snap','throw','swing','hello'].forEach(ev=>ch.on('broadcast',{event:ev},m=>hs[ev]&&hs[ev]({isMe:false,data:m.payload})));
 ch.subscribe(st=>{if(st==='SUBSCRIBED')res({emit:(t,d)=>ch.send({type:'broadcast',event:t,payload:d}),on:(t,f)=>{hs[t]=f}});else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')rej(new Error(st))})})}
const send=(t,d)=>{RM&&RM.emit(t,d).catch(()=>{})};
const canBat=()=>G.net?(G.top?0:1)===G.me:batHuman(),canPit=()=>G.net?(G.top?1:0)===G.me:pitHuman();
function snap(){const n=performance.now(),p=G.pitch,f=G.fl;return{gid:G.gid,seq:++G.seq,inn:G.inn,top:G.top,outs:G.outs,cnt:G.cnt,bases:G.bases,runs:G.runs,hits:G.hits,N:G.N,ph:G.phase,bid:G.bid|0,bt:G.bt,wo:G.walkoff,m:$('msg').textContent,sw:n-G.swingT<400?n-G.swingT:null,
 pitcherHands:G.pitcherHands, batterSides:G.batterSides,
 p:p&&{id:p.id,type:p.type,x:p.x,y:p.y,dur:p.dur,sg:p.sg,age:n-p.t0,fr:G.phase==='pitch'?null:p.t},f:f&&{id:f.id,out:f.out,fi:f.fi,ri:f.ri,wall:f.wall,to:f.to,kind:f.kind,dur:f.dur,h:f.h,diving:f.diving,age:n-p.t0?n-f.t0:0},mv:G.mv&&{id:G.mv.id,age:n-G.mv.t0,dur:G.mv.dur,moves:G.mv.moves,stay:G.mv.stay},th:G.th&&{id:G.th.id,age:n-G.th.t0,dur:G.th.dur,from:G.th.from,to:G.th.to,steps:G.th.steps},rl:G.rl&&{id:G.rl.id,age:n-G.rl.t0,moves:G.rl.moves}}}
let lastSync=0;const sync=()=>{const n=performance.now();if(G.net==='host'&&G.gid&&n-lastSync>110){lastSync=n;send('snap',snap())}};
setInterval(sync,200);
function applySnap(s){if(G.net!=='guest')return;
 if(s.gid!==G.gid){G.gid=s.gid;G.seq=0;gb=0;G.over=false;$('ov').style.display='none'}
 if(s.seq<=G.seq)return;G.seq=s.seq;const n=performance.now();
 Object.assign(G,{N:s.N,inn:s.inn,top:s.top,outs:s.outs,cnt:s.cnt,bases:s.bases,runs:s.runs,hits:s.hits,walkoff:s.wo,pitcherHands:s.pitcherHands,batterSides:s.batterSides});
 if(s.phase!=='sent'||s.ph!=='aim'||n-G.sentAt>1500)G.phase=s.ph;
 if(s.ph==='over'&&!G.over)over();
 if(s.p){if(!G.pitch||G.pitch.id!==s.p.id){G.pitch={...s.p,t0:n-s.p.age,t:0};G.cur={x:110,y:110}}if(s.p.fr!=null)G.pitch.t=s.p.fr}else G.pitch=null;
 if(s.f){if(!G.fl||G.fl.id!==s.f.id)G.fl={...s.f,t0:n-s.f.age}}else G.fl=null;
 if(s.mv){if(!G.mv||G.mv.id!==s.mv.id)G.mv={...s.mv,t0:n-s.mv.age}}else G.mv=null;
 if(s.th){if(!G.th||G.th.id!==s.th.id)G.th={...s.th,t0:n-s.th.age}}else G.th=null;
 if(s.rl){if(!G.rl||G.rl.id!==s.rl.id)G.rl={...s.rl,t0:n-s.rl.age}}else G.rl=null;
 if(s.bid!==gb){gb=s.bid;if(s.bt)banner(s.bt[0],s.bt[1])}
 if(s.sw!=null)G.swingT=n-s.sw;
 $('msg').textContent=s.m;updateHud()}
function remoteSwing(m){if(G.phase!=='pitch'||!m||typeof m.t!=='number')return;const p=G.pitch;p.t=m.t;G.phase='busy';G.swingT=performance.now();
 const ms=(m.t-1)*p.dur,[bx,by]=bp(p,p.t),dd=Math.hypot(bx-m.x,by-m.y),d=dist(p);
 if(Math.abs(ms)>220||dd>CONFIG.cursorSize||(d>=2&&Math.random()<.6))return result('miss', ms);
 
 const isUpper = by < m.y;
 const batterSide = G.batterSides ? G.batterSides[G.top ? 0 : 1] : 'right';
 const isLeft = bx < m.x;
 const isFast = ms < 0;
 
 const isGoodQuality = goodQ(batterSide, isLeft, isFast);
 
 let k = 'fly';
 if(!isGoodQuality){
  k = isUpper ? (Math.random() < 0.6 ? 'fly' : '1B') : (Math.random() < 0.7 ? 'gr' : '1B');
 }else{
  if(isUpper){
   const r=Math.random(); k=r<0.3?'HR':r<0.55?'2B':r<0.8?'fly':'3B';
  }else{
   const r=Math.random(); k=r<0.45?'1B':r<0.7?'2B':r<0.9?'gr':'3B';
  }
 }
 result(k,ms);}

function netStart(rm){RM=rm;
 rm.on('snap',m=>{if(!m.isMe)applySnap(m.data)});
 rm.on('throw',m=>{const d=m.data;if(!m.isMe&&G.net==='host'&&G.phase==='aim'&&!canPit()&&d)throwP(d.type in TY?d.type:'s',cl(+d.x||110,0,220),cl(+d.y||110,0,220))});
 rm.on('swing',m=>{if(!m.isMe&&G.net==='host')remoteSwing(m.data)});
 rm.on('hello',m=>{if(!m.isMe&&G.net==='hosting'){$('ov').style.display='none';newGame(hostN,true,true);G.net='host';G.me=0;G.seq=0;G.gid=Math.random();startHalf()}})}

async function hostRoom(N){$('ov').style.display='flex';
 const room=sbRoom();
 if(!room){$('ovs').textContent='Supabaseの設定が未入力か、読み込めなかった…(index.htmlの設定を確認)';return}
 const code=Math.random().toString(36).substring(2, 8).toUpperCase();let rm;
 try{rm=await room.join('yk'+code)}catch(e){$('ovs').textContent='部屋を作れなかった。もう一度試してね';return}
 hostN=N;G.net='hosting';netStart(rm);$('ovt').textContent='合言葉 '+code;$('ovs').textContent='相手にこの6桁を伝えて。入ってくるのを待ってるよ…'}

$('jn').onclick=async()=>{const c=$('code').value.trim().toUpperCase();
 if(!c){$('ovs').textContent='合言葉を入れてね';return}
 const room=sbRoom();
 if(!room){$('ovs').textContent='Supabaseの設定が未入力か、読み込めなかった…(index.htmlの設定を確認)';return}
 let rm;try{rm=await room.join('yk'+c)}catch(e){$('ovs').textContent='部屋に入れなかった…(招待や権限を確認してね)';return}
 newGame(3,true,true);G.net='guest';G.me=1;G.seq=0;G.gid=null;netStart(rm);$('ovs').textContent='ホストを待ってる…';
 const iv=setInterval(()=>{if(G.gid||G.net!=='guest')clearInterval(iv);else send('hello',1)},1000);send('hello',1)};
newGame(3,false,false);updateHud();loop();
</script>
