name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'refactor/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
